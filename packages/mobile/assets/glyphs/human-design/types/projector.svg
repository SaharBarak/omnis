<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Projector - Focused guiding energy</title>
  <!-- Focused beam/spotlight representing guidance -->
  <circle cx="50" cy="30" r="15" fill="currentColor"/>

  <!-- Beam projecting downward -->
  <polygon points="35,35 65,35 80,85 20,85" fill="currentColor" opacity="0.4"/>
  <polygon points="40,35 60,35 70,85 30,85" fill="currentColor" opacity="0.3"/>
  <polygon points="45,35 55,35 60,85 40,85" fill="currentColor" opacity="0.2"/>

  <!-- Focus point -->
  <circle cx="50" cy="75" r="5" fill="currentColor"/>
</svg>

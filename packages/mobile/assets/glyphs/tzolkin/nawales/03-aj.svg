<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Aj - Cane, Home, Authority</title>
  <!-- Stylized cane/reed glyph representing home and authority -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Vertical cane with nodes -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="50" cy="30" rx="10" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <ellipse cx="50" cy="50" rx="12" ry="6" fill="none" stroke="currentColor" stroke-width="2"/>
  <ellipse cx="50" cy="70" rx="10" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Iq' - Wind, Breath, Spirit</title>
  <!-- Stylized wind/breath glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Wind spirals -->
  <path d="M25 40 Q40 35, 50 40 Q60 45, 75 40" fill="none" stroke="currentColor" stroke-width="3"/>
  <path d="M30 55 Q45 50, 55 55 Q65 60, 80 55" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M25 70 Q40 65, 50 70 Q60 75, 70 70" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- T-shaped wind symbol -->
  <rect x="45" y="25" width="10" height="25" fill="currentColor" opacity="0.5"/>
  <rect x="35" y="20" width="30" height="8" fill="currentColor" opacity="0.5"/>
</svg>

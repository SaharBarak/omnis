<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Aq'ab'al - Night, Dawn, Darkness</title>
  <!-- Stylized night/dawn glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Half dark, half light -->
  <path d="M50 15 A35 35 0 0 0 50 85" fill="currentColor" opacity="0.7"/>
  <path d="M50 15 A35 35 0 0 1 50 85" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- Stars on dark side -->
  <circle cx="35" cy="40" r="2"/>
  <circle cx="30" cy="55" r="2"/>
  <circle cx="40" cy="65" r="2"/>
  <!-- Sun rays on light side -->
  <line x1="60" y1="40" x2="70" y2="40" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="50" x2="72" y2="50" stroke="currentColor" stroke-width="2"/>
  <line x1="60" y1="60" x2="70" y2="60" stroke="currentColor" stroke-width="2"/>
</svg>

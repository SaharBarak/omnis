<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Tz'i' - Dog, Law, Authority, Loyalty</title>
  <!-- Stylized dog glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Dog head -->
  <ellipse cx="50" cy="45" rx="20" ry="18" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="42" cy="40" r="4"/>
  <circle cx="58" cy="40" r="4"/>
  <!-- Snout -->
  <ellipse cx="50" cy="52" rx="10" ry="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="50" cy="50" r="3"/>
  <!-- Ears -->
  <ellipse cx="30" cy="35" rx="5" ry="12" fill="currentColor" transform="rotate(-20 30 35)"/>
  <ellipse cx="70" cy="35" rx="5" ry="12" fill="currentColor" transform="rotate(20 70 35)"/>
  <!-- Tongue -->
  <ellipse cx="50" cy="65" rx="4" ry="8" fill="currentColor" opacity="0.6"/>
</svg>

services:
  - type: cron
    name: omnis-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile.scraper
    plan: starter
    region: oregon
    schedule: "0 3 * * 0"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SCRAPER_MAX_PAGES
        value: "500"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="currentColor">
  <title>Castle - 52-day cycle (4 wavespells)</title>
  <!-- Castle structure showing 4 wavespells -->

  <!-- Outer castle outline -->
  <rect x="10" y="10" width="100" height="100" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- 4 quadrants representing 4 wavespells -->
  <rect x="15" y="15" width="42" height="42" rx="3" fill="currentColor" opacity="0.2"/>
  <rect x="63" y="15" width="42" height="42" rx="3" fill="currentColor" opacity="0.4"/>
  <rect x="15" y="63" width="42" height="42" rx="3" fill="currentColor" opacity="0.6"/>
  <rect x="63" y="63" width="42" height="42" rx="3" fill="currentColor" opacity="0.8"/>

  <!-- Numbers indicating wavespell order -->
  <text x="36" y="42" text-anchor="middle" font-size="16" font-weight="bold">1</text>
  <text x="84" y="42" text-anchor="middle" font-size="16" font-weight="bold">2</text>
  <text x="36" y="90" text-anchor="middle" font-size="16" font-weight="bold">3</text>
  <text x="84" y="90" text-anchor="middle" font-size="16" font-weight="bold">4</text>

  <!-- Center diamond -->
  <polygon points="60,45 75,60 60,75 45,60" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

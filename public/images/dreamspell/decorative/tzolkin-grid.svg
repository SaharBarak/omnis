<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="currentColor">
  <title>Tzolkin Grid - 260-day sacred calendar (20x13)</title>

  <!-- Grid representing 20 seals x 13 tones = 260 kin -->
  <g opacity="0.6">
    <!-- Vertical lines (20 columns for seals) -->
    <line x1="10" y1="10" x2="10" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="19" y1="10" x2="19" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="28" y1="10" x2="28" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="37" y1="10" x2="37" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="46" y1="10" x2="46" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="55" y1="10" x2="55" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="64" y1="10" x2="64" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="73" y1="10" x2="73" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="82" y1="10" x2="82" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="91" y1="10" x2="91" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="100" y1="10" x2="100" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="109" y1="10" x2="109" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="118" y1="10" x2="118" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="127" y1="10" x2="127" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="136" y1="10" x2="136" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="145" y1="10" x2="145" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="154" y1="10" x2="154" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="163" y1="10" x2="163" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="172" y1="10" x2="172" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="181" y1="10" x2="181" y2="250" stroke="currentColor" stroke-width="0.5"/>
    <line x1="190" y1="10" x2="190" y2="250" stroke="currentColor" stroke-width="0.5"/>

    <!-- Horizontal lines (13 rows for tones) -->
    <line x1="10" y1="10" x2="190" y2="10" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="28.5" x2="190" y2="28.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="47" x2="190" y2="47" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="65.5" x2="190" y2="65.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="84" x2="190" y2="84" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="102.5" x2="190" y2="102.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="121" x2="190" y2="121" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="139.5" x2="190" y2="139.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="158" x2="190" y2="158" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="176.5" x2="190" y2="176.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="195" x2="190" y2="195" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="213.5" x2="190" y2="213.5" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="232" x2="190" y2="232" stroke="currentColor" stroke-width="0.5"/>
    <line x1="10" y1="250" x2="190" y2="250" stroke="currentColor" stroke-width="0.5"/>
  </g>

  <!-- Mystic column highlight (column 10-11) -->
  <rect x="91" y="10" width="18" height="240" fill="currentColor" opacity="0.15"/>

  <!-- Corner markers -->
  <circle cx="14.5" cy="19.25" r="3" opacity="0.8"/>
  <circle cx="185.5" cy="19.25" r="3" opacity="0.8"/>
  <circle cx="14.5" cy="241" r="3" opacity="0.8"/>
  <circle cx="185.5" cy="241" r="3" opacity="0.8"/>
</svg>

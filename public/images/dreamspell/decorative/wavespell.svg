<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" fill="currentColor">
  <title>Wavespell - 13-day cycle diagram</title>
  <!-- 13 positions of a wavespell in a wave pattern -->
  <g opacity="0.8">
    <!-- Wave path -->
    <path d="M20 50 Q65 20, 130 50 T240 50" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3"/>

    <!-- 13 positions -->
    <circle cx="20" cy="50" r="8"/>
    <text x="20" y="70" text-anchor="middle" font-size="8">1</text>

    <circle cx="40" cy="40" r="8"/>
    <text x="40" y="60" text-anchor="middle" font-size="8">2</text>

    <circle cx="60" cy="30" r="8"/>
    <text x="60" y="50" text-anchor="middle" font-size="8">3</text>

    <circle cx="80" cy="25" r="8"/>
    <text x="80" y="45" text-anchor="middle" font-size="8">4</text>

    <circle cx="100" cy="30" r="8"/>
    <text x="100" y="50" text-anchor="middle" font-size="8">5</text>

    <circle cx="120" cy="40" r="8"/>
    <text x="120" y="60" text-anchor="middle" font-size="8">6</text>

    <circle cx="140" cy="50" r="10" stroke-width="2"/>
    <text x="140" y="75" text-anchor="middle" font-size="8">7</text>

    <circle cx="160" cy="40" r="8"/>
    <text x="160" y="60" text-anchor="middle" font-size="8">8</text>

    <circle cx="180" cy="30" r="8"/>
    <text x="180" y="50" text-anchor="middle" font-size="8">9</text>

    <circle cx="200" cy="25" r="8"/>
    <text x="200" y="45" text-anchor="middle" font-size="8">10</text>

    <circle cx="220" cy="35" r="8"/>
    <text x="220" y="55" text-anchor="middle" font-size="8">11</text>

    <circle cx="235" cy="45" r="8"/>
    <text x="235" y="65" text-anchor="middle" font-size="8">12</text>

    <circle cx="250" cy="55" r="8"/>
    <text x="250" y="75" text-anchor="middle" font-size="8">13</text>
  </g>
</svg>

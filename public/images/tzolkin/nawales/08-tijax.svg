<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Tijax - Obsidian Blade, Healing</title>
  <!-- Stylized obsidian knife/blade glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Double-edged blade -->
  <polygon points="50,20 35,50 50,80 65,50" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-width="2"/>
  <!-- Serrated edges -->
  <path d="M42 35 L35 50 L42 65" fill="none" stroke="currentColor" stroke-width="1"/>
  <path d="M58 35 L65 50 L58 65" fill="none" stroke="currentColor" stroke-width="1"/>
  <!-- Handle -->
  <rect x="45" y="75" width="10" height="8" fill="currentColor"/>
</svg>

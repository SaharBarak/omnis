<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Kej - Deer, Nature, Four Directions</title>
  <!-- Stylized deer glyph with four directions -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Deer head -->
  <ellipse cx="50" cy="50" rx="15" ry="18" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="45" cy="45" r="3"/>
  <circle cx="55" cy="45" r="3"/>
  <ellipse cx="50" cy="58" rx="5" ry="3" fill="currentColor"/>
  <!-- Antlers representing four directions -->
  <path d="M40 35 L30 20 M30 20 L25 25 M30 20 L35 25" stroke="currentColor" stroke-width="2" fill="none"/>
  <path d="M60 35 L70 20 M70 20 L75 25 M70 20 L65 25" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Four direction dots -->
  <circle cx="50" cy="20" r="3"/>
  <circle cx="50" cy="80" r="3"/>
  <circle cx="20" cy="50" r="3"/>
  <circle cx="80" cy="50" r="3"/>
</svg>

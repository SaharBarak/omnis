<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Kame - Death, Transformation, Ancestors</title>
  <!-- Stylized death/skull glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Skull outline -->
  <ellipse cx="50" cy="45" rx="22" ry="25" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Eye sockets -->
  <ellipse cx="40" cy="40" rx="7" ry="8" fill="currentColor"/>
  <ellipse cx="60" cy="40" rx="7" ry="8" fill="currentColor"/>
  <!-- Nose hole -->
  <polygon points="50,50 45,58 55,58"/>
  <!-- Teeth -->
  <rect x="38" y="62" width="6" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="47" y="62" width="6" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="56" y="62" width="6" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
</svg>

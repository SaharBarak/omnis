<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <title>Imox - Crocodile, Water, Subconscious</title>
  <!-- Stylized crocodile/water glyph -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Crocodile head -->
  <ellipse cx="50" cy="40" rx="20" ry="15" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="42" cy="35" r="4"/>
  <circle cx="58" cy="35" r="4"/>
  <!-- Snout with teeth -->
  <path d="M35 50 L30 60 L40 55 L50 60 L60 55 L70 60 L65 50" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Water waves -->
  <path d="M20 70 Q30 65, 40 70 Q50 75, 60 70 Q70 65, 80 70" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

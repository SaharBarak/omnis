<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="currentColor">
  <title>Human Design Bodygraph - 9 Centers and Channels</title>

  <!-- Channels (connections between centers) -->
  <g stroke="currentColor" stroke-width="2" fill="none" opacity="0.4">
    <!-- Head to Ajna -->
    <line x1="100" y1="35" x2="100" y2="65"/>

    <!-- Ajna to Throat -->
    <line x1="100" y1="95" x2="100" y2="115"/>

    <!-- Throat to G-Center -->
    <line x1="100" y1="145" x2="100" y2="165"/>

    <!-- G-Center to Sacral -->
    <line x1="100" y1="195" x2="100" y2="215"/>

    <!-- Sacral to Root -->
    <line x1="100" y1="245" x2="100" y2="265"/>

    <!-- Throat to Heart (Will) -->
    <line x1="115" y1="130" x2="145" y2="145"/>

    <!-- Heart to G-Center -->
    <line x1="145" y1="165" x2="115" y2="180"/>

    <!-- Throat to Spleen -->
    <line x1="85" y1="130" x2="55" y2="175"/>

    <!-- Spleen to Sacral -->
    <line x1="55" y1="205" x2="85" y2="230"/>

    <!-- Spleen to Root -->
    <line x1="55" y1="220" x2="70" y2="275"/>

    <!-- Sacral to Root - side connections -->
    <line x1="115" y1="245" x2="130" y2="275"/>

    <!-- G-Center to Spleen -->
    <line x1="85" y1="180" x2="55" y2="190"/>

    <!-- Solar Plexus to Sacral -->
    <line x1="145" y1="220" x2="115" y2="230"/>

    <!-- Solar Plexus to Root -->
    <line x1="145" y1="235" x2="130" y2="275"/>

    <!-- Heart to Solar Plexus -->
    <line x1="145" y1="165" x2="145" y2="205"/>

    <!-- G-Center to Solar Plexus -->
    <line x1="115" y1="180" x2="145" y2="205"/>
  </g>

  <!-- 9 Centers -->
  <!-- Head Center (triangle pointing up) -->
  <polygon points="100,10 85,35 115,35" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Ajna Center (triangle pointing down) -->
  <polygon points="100,95 85,70 115,70" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Throat Center (square) -->
  <rect x="85" y="115" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- G-Center/Self (diamond) -->
  <polygon points="100,165 85,180 100,195 115,180" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Heart/Will Center (small triangle) -->
  <polygon points="145,145 135,165 155,165" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Spleen Center (triangle pointing left) -->
  <polygon points="40,190 55,175 55,205" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Solar Plexus (triangle pointing right) -->
  <polygon points="160,220 145,205 145,235" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Sacral Center (square) -->
  <rect x="85" y="215" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Root Center (square) -->
  <rect x="85" y="265" width="30" height="20" fill="none" stroke="currentColor" stroke-width="2"/>
</svg>

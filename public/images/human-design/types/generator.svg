  <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="50" cy="50" r="15" fill="currentColor"/>

  <!-- Energy waves emanating -->
  <path d="M50 10 Q60 20, 50 30" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M90 50 Q80 60, 70 50" fill="none" stroke="currentColor" stroke-width="2"/>
